<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Broadwatch</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Broadwatch">
<meta name="theme-color" content="#f3f0e9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="m.css">
</head>
<body>
<header class="top">
	<div class="brand">Broad<b>watch</b></div>
	<div class="when" id="when">connecting…</div>
</header>
<main id="main">
	<section class="verdict" id="verdict"><div class="empty">waiting for the server…</div></section>
	<section class="tiles" id="tiles"></section>
	<section class="sec"><h2>Open items</h2><div id="alerts" class="list"></div></section>
	<section class="sec"><h2>Streams into the switcher</h2><div id="streams"></div></section>
	<section class="sec"><h2>Stream paths</h2><div id="paths" class="list"></div></section>
	<section class="sec"><h2>Mics</h2><div id="mics" class="list"></div></section>
	<section class="sec"><h2>Ask the engineer</h2><div class="ask"><input id="askInput" placeholder="ask about the network…"><button id="askBtn">Ask</button></div><div id="askOut"></div></section>
	<section class="sec"><h2>Log · errors and warnings, last 24 h</h2><div id="journal" class="list"></div></section>
	<section class="sec"><h2>What changed</h2><div id="events" class="list"></div></section>
	<footer>Broadwatch · the same server as the desk, on your phone</footer>
</main>
<script src="m.js"></script>
</body>
</html>

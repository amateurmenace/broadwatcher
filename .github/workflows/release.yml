name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # the public "Broadwatch Community" build goes to this public repository when the PUBLIC_RELEASE_TOKEN
  # secret (a fine-grained token with Contents: write on that repository) exists; otherwise it is attached to
  # the private release next to the BIG build
  PUBLIC_REPO: amateurmenace/broadwatcher-community

jobs:
  # create the releases first, so the builders below never race to create them (that race lost the mac dmg once)
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release if it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v$(node -p "require('./package.json').version")";; esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Broadwatch ${TAG#v}" --notes "Broadwatch (BIG build, keys embedded). Mac universal dmg / zip and Windows installer / portable. Unsigned: Mac = right-click > Open on first launch, Windows = SmartScreen > More info > Run anyway. The public Broadwatch Community build is released separately when the public repository is configured, otherwise it is attached here too."
      - name: Create the public release for Broadwatch Community (when the public repository token exists)
        if: ${{ env.HAS_PUBLIC_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v$(node -p "require('./package.json').version")";; esac
          gh release view "$TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$PUBLIC_REPO" --title "Broadwatch Community ${TAG#v}" --notes "Mac (universal dmg / zip) and Windows (installer / portable) builds of the public flavour: no keys inside, enter your own in Settings on first start. Unsigned: Mac = right-click > Open on first launch, Windows = SmartScreen > More info > Run anyway."
    env:
      HAS_PUBLIC_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN != '' }}

  build:
    name: Build ${{ matrix.flavor }} (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        flavor: [private, public]
    runs-on: ${{ matrix.os }}
    env:
      HAS_PUBLIC_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci || npm install
      - name: Embed the Anthropic key into the private build (repository secret ANTHROPIC_API_KEY, optional)
        if: matrix.flavor == 'private'
        run: node scripts/embed-secrets.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      - name: Build and publish the private build to this repository's release
        if: matrix.flavor == 'private'
        run: node scripts/build-flavor.mjs private --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build and publish Broadwatch Community to the public repository
        if: matrix.flavor == 'public' && env.HAS_PUBLIC_TOKEN == 'true'
        run: node scripts/build-flavor.mjs public --publish always
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          BW_PUBLIC_REPO: broadwatcher-community
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build and publish Broadwatch Community next to the private build (no public token yet)
        if: matrix.flavor == 'public' && env.HAS_PUBLIC_TOKEN != 'true'
        run: node scripts/build-flavor.mjs public --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Keep the installers as workflow artifacts too
        uses: actions/upload-artifact@v4
        with:
          name: Broadwatch-${{ matrix.flavor }}-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/public/*.dmg
            dist/public/*.zip
            dist/public/*.exe
          if-no-files-found: warn
